<body class="min-h-screen flex items-center justify-center">
    <main class="w-full">
      <div id="content" class="container opacity-0"><section data-section-type="boxed_text" data-section-id="pg073_sec001" class="mx-auto w-full max-w-5xl bg-[#eef5ea] px-8 py-8 text-slate-800 max-sm:px-5"><div class="rounded-[2rem] border border-emerald-700/30 bg-white p-6 shadow-sm space-y-3"><h1 data-id="pg073_n0013" class="adt-h2 font-bold text-emerald-800">Njia mbadala</h1><h2 data-id="pg073_n0015" class="adt-h2 font-bold text-emerald-800">Hatua</h2><span data-id="pg073_n0018" class="adt-body font-bold text-orange-700">1.</span><div data-id="pg073_n0019" class="adt-body overflow-x-auto text-center">Jumlisha namba nzima;\ 2+1=3</div><span data-id="pg073_n0021" class="adt-body font-bold text-orange-700">2.</span><p data-id="pg073_n0022" class="adt-body leading-relaxed">Jumlisha sehemu, tafuta KDS cha 4 na 5:</p><div data-id="pg073_n0023" class="adt-body overflow-x-auto text-center"><math><mrow><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>+</mo><mfrac><mn>3</mn><mn>5</mn></mfrac><mo>=</mo><mfrac><mrow><mn>5</mn><mo>+</mo><mn>12</mn></mrow><mn>20</mn></mfrac><mo>=</mo><mfrac><mn>17</mn><mn>20</mn></mfrac><mi>.</mi></mrow></math></div><span data-id="pg073_n0025" class="adt-body font-bold text-orange-700">3.</span><p data-id="pg073_n0026" class="adt-body leading-relaxed">Chukua 3 uliyopata katika hatua ya 1, kisha jumlisha na jibu ulilolipata baada ya kujumlisha sehemu ili kupata;</p><div data-id="pg073_n0027" class="adt-body overflow-x-auto text-center"><math><mrow><mn>3</mn><mo>+</mo><mfrac><mn>17</mn><mn>20</mn></mfrac><mo>=</mo><mn>3</mn><mfrac><mn>17</mn><mn>20</mn></mfrac><mi>.</mi></mrow></math></div><p data-id="pg073_n0028" class="adt-body text-center italic">Kwa hiyo, <math><mrow><mn>2</mn><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>+</mo><mn>1</mn><mfrac><mn>3</mn><mn>5</mn></mfrac><mo>=</mo><mn>3</mn><mfrac><mn>17</mn><mn>20</mn></mfrac></mrow></math>.</p></div></section></div>
