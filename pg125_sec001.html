    <main class="w-full">
      <div id="content" class="container opacity-0"><section data-section-type="boxed_text" data-section-id="pg125_sec001" class="mx-auto w-full max-w-5xl bg-[#f7fbf7] px-8 py-10 text-slate-800 max-sm:px-5"><article class="overflow-hidden rounded-[2rem] border border-emerald-700 bg-white shadow-[0_10px_30px_rgba(16,185,129,0.10)]"><div class="px-6 pt-4"><div class="inline-block min-w-[17rem] rounded-bl-[1.5rem] rounded-br-[0.2rem] rounded-tl-[1.5rem] rounded-tr-[1.5rem] border border-emerald-700 bg-emerald-200 px-5 py-3"><h1 data-id="pg125_n0004" class="adt-h3 font-bold text-emerald-900">Mfano wa pili</h1></div></div><div class="mx-6 mb-6 -mt-px space-y-5 rounded-[1.75rem] border border-emerald-200 bg-white px-6 py-6"><p data-id="pg125_n0006" class="adt-body leading-relaxed">Tafuta thamani ya <math><mi>m</mi></math> ikiwa, <math><mrow><mn>2</mn><mo>÷</mo><mi>m</mi><mo>=</mo><mn>7</mn></mrow></math>.</p><h2 data-id="pg125_n0008" class="adt-h3 font-bold text-slate-900">Njia</h2><p data-id="pg125_n0009" class="adt-body leading-relaxed"><math><mrow><mn>2</mn><mo>÷</mo><mi>m</mi><mo>=</mo><mn>7</mn></mrow></math> ni sawa na kuandika <math><mrow><mfrac><mn>2</mn><mi>m</mi></mfrac><mo>=</mo><mn>7</mn></mrow></math>.</p><p data-id="pg125_n0010" class="adt-body leading-relaxed">Zidisha kwa <math><mi>m</mi></math> (asili) kila upande.</p><div data-id="pg125_n0011" class="adt-body overflow-x-auto py-1 text-lg"><math><mrow><mi>m</mi><mo>×</mo><mfrac><mn>2</mn><mi>m</mi></mfrac><mo>=</mo><mn>7</mn><mo>×</mo><mi>m</mi></mrow></math></div><div data-id="pg125_n0012" class="adt-body overflow-x-auto py-1 text-lg">2 = 7m</div><p data-id="pg125_n0013" class="adt-body leading-relaxed">Gawanya kwa 7 kila upande ili kupata thamani ya <math><mi>m</mi></math>.</p><div data-id="pg125_n0014" class="adt-body overflow-x-auto py-1 text-lg"><math><mrow><mfrac><mn>2</mn><mn>7</mn></mfrac><mo>=</mo><mfrac><mrow><mn>7</mn><mi>m</mi></mrow><mn>7</mn></mfrac></mrow></math></div><div data-id="pg125_n0015" class="adt-body overflow-x-auto py-1 text-lg"><math><mrow><mfrac><mn>2</mn><mn>7</mn></mfrac><mo>=</mo><mi>m</mi></mrow></math></div><p data-id="pg125_n0016" class="adt-body leading-relaxed">Kwa hiyo, thamani ya <math><mi>m</mi></math> ni <math><mfrac><mn>2</mn><mn>7</mn></mfrac></math>.</p></div></article></section></div>
