      <div id="content" class="container opacity-0"><section data-section-type="boxed_text" data-section-id="pg119_sec002" class="mx-auto w-full max-w-5xl bg-[#f7fbf7] px-8 py-10 text-slate-800 max-sm:px-5"><div class="mb-3"><h1 data-id="pg119_n0003" class="adt-h2 font-bold text-slate-900">Kutoa milinganyo sahili</h1></div><article class="overflow-visible rounded-[2rem] border border-emerald-700/35 bg-white shadow-[0_2px_8px_rgba(0,0,0,0.06)]"><div class="px-5 pb-5 pt-0 max-sm:px-4"><div class="mb-4 ml-4 inline-block rounded-b-[1.8rem] border-2 border-emerald-700 bg-lime-100 px-5 py-2 shadow-sm max-sm:ml-3"><h2 data-id="pg119_n0005" class="adt-h3 font-bold text-emerald-900">Mfano wa kwanza</h2></div><p data-id="pg119_n0006" class="adt-body mb-4 leading-relaxed">Tafuta thamani ya <math><mi>k</mi></math> katika mlinganyo <math><mrow><mi>k</mi><mo>−</mo><mn>5</mn><mo>=</mo><mn>7</mn></mrow></math>.</p><h3 data-id="pg119_n0007" class="adt-h3 mb-2 font-bold text-slate-900">Njia</h3><p data-id="pg119_n0008" class="adt-body mb-2 leading-relaxed">Ili <math><mi>k</mi></math> ibaki peke yake, jumlisha 5 kila upande.</p><div class="mb-4 space-y-1 pl-6 max-sm:pl-3"><div data-id="pg119_n0009" class="adt-body overflow-x-auto text-slate-900">k - 5 + 5 = 7 + 5</div><div data-id="pg119_n0010" class="adt-body overflow-x-auto pl-4 text-slate-900 max-sm:pl-2">k + 0 = 12</div><div data-id="pg119_n0011" class="adt-body overflow-x-auto pl-8 text-slate-900 max-sm:pl-4">k = 12</div></div><p data-id="pg119_n0012" class="adt-body leading-relaxed">Kwa hiyo, thamani ya <math><mi>k</mi></math> ni 12.</p></div></article></section></div>
