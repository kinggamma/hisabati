    <main class="w-full">
      <div id="content" class="container opacity-0"><section data-section-type="text_and_single_image" data-section-id="pg116_sec001" class="mx-auto w-full max-w-5xl bg-[#f7fbf7] px-8 py-10 text-slate-800 max-sm:px-5"><article class="mt-6 overflow-visible rounded-[2rem] border border-[#9fb39b] bg-white/95 shadow-sm"><div class="px-8 pb-8 pt-0 max-sm:px-5"><div class="-mt-6 mb-5 inline-block rounded-[1.6rem_1.6rem_0_0.4rem] border-2 border-[#2b6e3b] bg-[#cfd7c9] px-8 py-3 shadow-sm"><h1 data-id="pg116_n0004" class="adt-h2 font-bold text-[#14532d]">Mfano wa pili</h1></div><p data-id="pg116_n0006" class="adt-body mb-5 leading-relaxed text-neutral-800">Tafuta thamani ya y ikiwa, <math><mrow><mi>y</mi><mo>+</mo><mn>12</mn><mo>+</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>69</mn></mrow></math></p><h2 data-id="pg116_n0007" class="adt-h2 mb-3 font-bold text-neutral-900">Njia</h2><p data-id="pg116_n0009" class="adt-body mb-3 leading-relaxed text-neutral-800">Weka mitajo yenye kigeu pamoja, kisha jumlisha.</p><div data-id="pg116_n0011" class="adt-body overflow-x-auto text-neutral-900 mb-2">y+2y+12=69</div><div data-id="pg116_n0012" class="adt-body overflow-x-auto text-neutral-900 mb-5">3y+12=69</div><p data-id="pg116_n0014" class="adt-body mb-3 leading-relaxed text-neutral-800">Toa 12 kila upande</p><div data-id="pg116_n0016" class="adt-body overflow-x-auto text-neutral-900 mb-2">3y+12-12=69-12</div><div data-id="pg116_n0017" class="adt-body overflow-x-auto text-neutral-900 mb-2 pl-12 max-sm:pl-6">3y+0=57</div><div data-id="pg116_n0018" class="adt-body overflow-x-auto text-neutral-900 mb-5 pl-16 max-sm:pl-8">3y=57</div><p data-id="pg116_n0020" class="adt-body mb-3 leading-relaxed text-neutral-800">Gawanya kwa 3 pande zote mbili.</p><div data-id="pg116_n0022" class="adt-body overflow-x-auto text-neutral-900 mb-4"><math><mrow><mfrac><mrow><mn>3</mn><mi>y</mi></mrow><mn>3</mn></mfrac><mo>=</mo><mfrac><mn>57</mn><mn>3</mn></mfrac></mrow></math></div><div data-id="pg116_n0023" class="adt-body overflow-x-auto text-neutral-900 mb-4 pl-8 max-sm:pl-4">y=19</div><p data-id="pg116_n0025" class="adt-body leading-relaxed text-neutral-800">Kwa hiyo, thamani ya y ni 19.</p></div></article></section></div>
